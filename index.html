<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark War Survival - Command HQ & Timer</title>
  <style>
    :root {
      --bg-color: #0b0d0e;
      --panel-bg: #13171a;
      --panel-border: #263238;
      --accent-amber: #ff9800;
      --accent-cyan: #00bcd4;
      --accent-red: #f44336;
      --text-main: #cfd8dc;
      --text-dim: #78909c;
      --font-hud: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-hud);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 188, 212, 0.05) 0%, transparent 80%),
        linear-gradient(rgba(19, 23, 26, 0.8) 1px, transparent 1px),
        linear-gradient(90deg, rgba(19, 23, 26, 0.8) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
    }

    .hud-card {
      background: var(--panel-bg);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      padding: 24px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255, 152, 0, 0.1);
      position: relative;
    }

    .hud-card::before {
      content: "TACTICAL HQ // TIME COMMAND";
      position: absolute;
      top: -12px;
      left: 20px;
      background: var(--panel-bg);
      padding: 0 10px;
      font-size: 0.75rem;
      color: var(--accent-amber);
      letter-spacing: 2px;
      border: 1px solid var(--panel-border);
    }

    .clock-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    @media (max-width: 500px) {
      .clock-grid {
        grid-template-columns: 1fr;
      }
    }

    .clock-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--panel-border);
      padding: 15px;
      border-radius: 4px;
      text-align: center;
    }

    .clock-box.server { border-color: rgba(255, 152, 0, 0.4); }
    .clock-box.local { border-color: rgba(0, 188, 212, 0.4); }

    .clock-title {
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .clock-time {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .server .clock-time { color: var(--accent-amber); }
    .local .clock-time { color: var(--accent-cyan); }

    /* SECTION CONTAINERS */
    .section-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px dashed var(--panel-border);
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 0.85rem;
      color: var(--text-main);
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    /* SLIDER SECTION */
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .slider-readout {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-amber);
    }

    input[type="range"] {
      width: 100%;
      height: 8px;
      background: #1c2429;
      border-radius: 4px;
      outline: none;
      accent-color: var(--accent-amber);
      margin-bottom: 15px;
    }

    .step-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .btn {
      background: #1c2429;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 14px;
      font-family: var(--font-hud);
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--panel-border);
      color: var(--accent-amber);
    }

    .btn.primary {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .btn.primary:hover {
      background: rgba(0, 188, 212, 0.2);
    }

    .btn.danger {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .btn.danger:hover {
      background: rgba(244, 67, 54, 0.2);
    }

    .result-box {
      background: rgba(0, 188, 212, 0.05);
      border: 1px solid rgba(0, 188, 212, 0.3);
      padding: 12px;
      border-radius: 4px;
      text-align: center;
    }

    .result-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .result-value {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-cyan);
    }

    .day-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 8px;
      background: rgba(255,255,255,0.1);
      color: var(--text-dim);
    }

    .day-badge.prev {
      background: rgba(255, 152, 0, 0.2);
      color: var(--accent-amber);
    }

    /* COUNTDOWN TIMER SECTION */
    .timer-inputs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
    }

    .timer-field {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-field label {
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .timer-input {
      width: 60px;
      background: #000;
      border: 1px solid var(--panel-border);
      color: var(--accent-cyan);
      font-family: var(--font-hud);
      font-size: 1.2rem;
      text-align: center;
      padding: 6px;
      border-radius: 4px;
    }

    .timer-input:focus {
      outline: none;
      border-color: var(--accent-cyan);
    }

    .timer-display {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent-amber);
      text-align: center;
      margin-bottom: 15px;
      letter-spacing: 3px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border: 1px solid var(--panel-border);
      border-radius: 4px;
    }

    .timer-display.finished {
      color: var(--accent-red);
      animation: pulse-red 1s infinite alternate;
    }

    @keyframes pulse-red {
      from { border-color: rgba(244, 67, 54, 0.3); box-shadow: 0 0 5px rgba(244, 67, 54, 0.2); }
      to { border-color: var(--accent-red); box-shadow: 0 0 15px var(--accent-red); }
    }
  </style>
</head>
<body>

  <div class="hud-card">
    <!-- Live Clocks -->
    <div class="clock-grid">
      <div class="clock-box server">
        <div class="clock-title">// GAME SERVER TIME (+3H)</div>
        <div class="clock-time" id="serverClock">00:00:00</div>
      </div>
      <div class="clock-box local">
        <div class="clock-title">// YOUR LOCAL TIME</div>
        <div class="clock-time" id="localClock">00:00:00</div>
      </div>
    </div>

    <!-- Countdown Timer -->
    <div class="section-box">
      <div class="section-title">// MARCH & TACTICAL COUNTDOWN TIMER</div>
      
      <div class="timer-inputs">
        <div class="timer-field">
          <label>HOURS</label>
          <input type="number" id="timerH" class="timer-input" min="0" max="99" value="0">
        </div>
        <span style="font-size: 1.2rem; margin-top: 12px;">:</span>
        <div class="timer-field">
          <label>MINS</label>
          <input type="number" id="timerM" class="timer-input" min="0" max="59" value="15">
        </div>
        <span style="font-size: 1.2rem; margin-top: 12px;">:</span>
        <div class="timer-field">
          <label>SECS</label>
          <input type="number" id="timerS" class="timer-input" min="0" max="59" value="0">
        </div>
      </div>

      <div class="timer-display" id="timerDisplay">00:15:00</div>

      <div class="step-buttons" style="margin-bottom: 0;">
        <button class="btn primary" id="startTimerBtn" onclick="toggleTimer()">START</button>
        <button class="btn danger" onclick="resetTimer()">RESET</button>
      </div>
    </div>

    <!-- 24-Hour Converter -->
    <div class="section-box" style="margin-bottom: 0;">
      <div class="slider-header">
        <span class="section-title" style="margin-bottom:0;">// 24-HOUR EVENT TIMELINE</span>
        <span class="slider-readout" id="sliderValDisplay">12:00</span>
      </div>

      <input type="range" id="timeSlider" min="0" max="1425" step="15" value="720">

      <div class="step-buttons">
        <button class="btn" onclick="adjustSlider(-60)">-1H</button>
        <button class="btn" onclick="adjustSlider(-15)">-15M</button>
        <button class="btn" onclick="adjustSlider(15)">+15M</button>
        <button class="btn" onclick="adjustSlider(60)">+1H</button>
      </div>

      <div class="result-box">
        <div class="result-label">CONVERTED LOCAL TIME (-3 HOURS)</div>
        <div class="result-value">
          <span id="convertedLocalTime">09:00</span>
          <span class="day-badge" id="dayBadge">SAME DAY</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const OFFSET_HOURS = 3;

    function formatDigits(num) {
      return String(num).padStart(2, '0');
    }

    // CLOCK LOGIC
    function updateLiveClocks() {
      const now = new Date();
      const localH = formatDigits(now.getHours());
      const localM = formatDigits(now.getMinutes());
      const localS = formatDigits(now.getSeconds());
      document.getElementById('localClock').textContent = `${localH}:${localM}:${localS}`;

      const serverDate = new Date(now.getTime() + (OFFSET_HOURS * 3600 * 1000));
      const serverH = formatDigits(serverDate.getHours());
      const serverM = formatDigits(serverDate.getMinutes());
      const serverS = formatDigits(serverDate.getSeconds());
      document.getElementById('serverClock').textContent = `${serverH}:${serverM}:${serverS}`;
    }

    // CONVERTER LOGIC
    function updateConverter() {
      const sliderVal = parseInt(document.getElementById('timeSlider').value, 10);
      const serverHours = Math.floor(sliderVal / 60);
      const serverMins = sliderVal % 60;

      document.getElementById('sliderValDisplay').textContent = 
        `${formatDigits(serverHours)}:${formatDigits(serverMins)} SERVER`;

      let localTotalMins = sliderVal - (OFFSET_HOURS * 60);
      let isPrevDay = false;

      if (localTotalMins < 0) {
        localTotalMins += 24 * 60;
        isPrevDay = true;
      }

      const localHours = Math.floor(localTotalMins / 60);
      const localMins = localTotalMins % 60;

      document.getElementById('convertedLocalTime').textContent = 
        `${formatDigits(localHours)}:${formatDigits(localMins)}`;

      const badge = document.getElementById('dayBadge');
      if (isPrevDay) {
        badge.textContent = "PREVIOUS DAY";
        badge.className = "day-badge prev";
      } else {
        badge.textContent = "SAME DAY";
        badge.className = "day-badge";
      }
    }

    function adjustSlider(amount) {
      const slider = document.getElementById('timeSlider');
      let val = parseInt(slider.value, 10) + amount;
      if (val < 0) val = 0;
      if (val > 1425) val = 1425;
      slider.value = val;
      updateConverter();
    }

    // TIMER LOGIC
    let timerInterval = null;
    let totalSecondsLeft = 0;
    let isRunning = false;

    function parseInputSeconds() {
      const h = parseInt(document.getElementById('timerH').value, 10) || 0;
      const m = parseInt(document.getElementById('timerM').value, 10) || 0;
      const s = parseInt(document.getElementById('timerS').value, 10) || 0;
      return (h * 3600) + (m * 60) + s;
    }

    function updateTimerDisplay(secs) {
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      document.getElementById('timerDisplay').textContent = 
        `${formatDigits(h)}:${formatDigits(m)}:${formatDigits(s)}`;
    }

    function toggleTimer() {
      const btn = document.getElementById('startTimerBtn');
      const display = document.getElementById('timerDisplay');

      if (isRunning) {
        // PAUSE
        clearInterval(timerInterval);
        isRunning = false;
        btn.textContent = "RESUME";
      } else {
        // START OR RESUME
        if (totalSecondsLeft <= 0) {
          totalSecondsLeft = parseInputSeconds();
        }
        if (totalSecondsLeft <= 0) return;

        display.classList.remove('finished');
        isRunning = true;
        btn.textContent = "PAUSE";

        timerInterval = setInterval(() => {
          totalSecondsLeft--;
          updateTimerDisplay(totalSecondsLeft);

          if (totalSecondsLeft <= 0) {
            clearInterval(timerInterval);
            isRunning = false;
            btn.textContent = "START";
            display.classList.add('finished');
            display.textContent = "00:00:00 - EXPIRED!";
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      document.getElementById('startTimerBtn').textContent = "START";
      const display = document.getElementById('timerDisplay');
      display.classList.remove('finished');
      totalSecondsLeft = parseInputSeconds();
      updateTimerDisplay(totalSecondsLeft);
    }

    // EVENT LISTENERS
    document.getElementById('timeSlider').addEventListener('input', updateConverter);
    ['timerH', 'timerM', 'timerS'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        if (!isRunning) {
          totalSecondsLeft = parseInputSeconds();
          updateTimerDisplay(totalSecondsLeft);
        }
      });
    });

    setInterval(updateLiveClocks, 1000);
    updateLiveClocks();
    updateConverter();
    resetTimer();
  </script>
</body>
</html>
